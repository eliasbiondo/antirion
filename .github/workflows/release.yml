# On a vX.Y.Z tag: release binaries for Linux (amd64 and arm64) with the console embedded,
# their SHA-256 checksums, and multi-arch images on ghcr.io, each with a CycloneDX SBOM, keyless
# Sigstore signatures bound to this workflow, and SLSA v1.0 Build Level 3 provenance; the published
# artefacts are verified before the release is published. publish.yml then copies the image to
# Docker Hub.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # A crash found by the nightly fuzzing blocks the release until a later nightly run passes.
  fuzz-gate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Every fuzz job of the last nightly run passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0].id')
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("fuzz (")) | "\(.name) \(.conclusion)"')
          echo "nightly run $run:"
          echo "${jobs:-no fuzz jobs}"
          test -n "$jobs"
          ! grep -v ' success$' <<< "$jobs"

  # The console's static export, built once and embedded in every binary.
  console:
    needs: fuzz-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ANTIRION_BUILD_COMMIT: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console
          path: console/out
          if-no-files-found: error

  # Archives are named antirion-<tag>-linux-<arch>.tar.gz, arch amd64 or arm64, each holding the one
  # file `antirion`.
  binaries-linux:
    needs: console
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 12, the image's base: the binaries and archives need glibc 2.36 or later.
    container: rust:1.98.1-bookworm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console
          path: console/out
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-auditable,cargo-cyclonedx
      - name: The build is reproducible
        run: |
          git config --global --add safe.directory '*'
          ci/reproducible.sh --auditable --package antirion --bin antirion
      - name: Build
        env:
          ANTIRION_BUILD_COMMIT: ${{ github.sha }}
          CARGO_INCREMENTAL: "0"
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export CARGO_BUILD_RUSTFLAGS="--remap-path-prefix=$PWD=/antirion --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
          export CFLAGS="-ffile-prefix-map=$PWD=/antirion" CXXFLAGS="-ffile-prefix-map=$PWD=/antirion"
          cargo auditable build --release --locked -p antirion
          target/release/antirion version --json | tee version.json
          if grep -q test-hooks version.json; then echo "the release binary has test hooks" >&2; exit 1; fi
          ci/glibc-floor.sh target/release/antirion
          mkdir -p dist/${{ matrix.arch }}
          cp target/release/antirion dist/${{ matrix.arch }}/antirion
          tar -C dist/${{ matrix.arch }} -czf antirion-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz antirion
      - name: SBOM
        run: |
          cargo cyclonedx --manifest-path crates/antirion/Cargo.toml --format json --spec-version 1.5
          cp crates/antirion/*.cdx.json antirion-${{ github.ref_name }}-linux-${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            antirion-*.tar.gz
            antirion-*.cdx.json
            dist/${{ matrix.arch }}/antirion

  # One SHA-256 list of every archive, published with them, and the subjects of their provenance.
  checksums:
    needs: binaries-linux
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      subjects: ${{ steps.sums.outputs.subjects }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - id: sums
        run: |
          sums="antirion-$GITHUB_REF_NAME-sha256sums.txt"
          for platform in linux-amd64 linux-arm64; do
            test -f "antirion-$GITHUB_REF_NAME-$platform.tar.gz" || { echo "no archive for $platform" >&2; exit 1; }
          done
          sha256sum antirion-*.tar.gz | tee "$sums"
          echo "subjects=$(base64 -w0 < "$sums")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: antirion-*-sha256sums.txt

  sign:
    needs: checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Keyless signatures of the archives, SBOMs and checksums
        run: |
          for f in antirion-*.tar.gz antirion-*.cdx.json antirion-*-sha256sums.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: "*.sigstore.json"

  provenance:
    needs: checksums
    permissions:
      actions: read
      id-token: write
      contents: write
    # The SLSA generators refuse to run unless referenced by a full release tag, never by a commit.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.checksums.outputs.subjects }}
      upload-assets: false
      provenance-name: antirion-${{ github.ref_name }}.intoto.jsonl

  image:
    needs: binaries-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-*
          merge-multiple: true
      - run: chmod 0755 dist/*/antirion
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Smoke test the amd64 image
        run: |
          docker buildx build --load --platform linux/amd64 --build-arg BINARY=prebuilt -f docker/Dockerfile -t antirion:smoke .
          docker/test/smoke.sh antirion:smoke
          docker/test/quickstart.sh antirion:smoke
      - id: push
        name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BINARY=prebuilt
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-cyclonedx
      - name: Sign the image by digest and attest its SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cargo cyclonedx --manifest-path crates/antirion/Cargo.toml --format json --spec-version 1.5
          cosign attest --yes --type cyclonedx --predicate crates/antirion/*.cdx.json "$IMAGE@$DIGEST"

  image-provenance:
    needs: image
    permissions:
      actions: read
      id-token: write
      packages: write
    # Referenced by its release tag, like the generic generator above.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-and-publish:
    needs: [sign, provenance, image, image-provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: antirion-${{ github.ref_name }}.intoto.jsonl
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Verify signatures and provenance of what is published
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          for f in antirion-*.tar.gz antirion-*.cdx.json antirion-*-sha256sums.txt; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          sha256sum --check --strict "antirion-${GITHUB_REF_NAME}-sha256sums.txt"
          for f in antirion-*.tar.gz; do
            slsa-verifier verify-artifact "$f" \
              --provenance-path "antirion-${GITHUB_REF_NAME}.intoto.jsonl" \
              --source-uri "github.com/$GITHUB_REPOSITORY" --source-tag "$GITHUB_REF_NAME"
          done
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cat > notes.md <<NOTES
          Run it: \`docker run -p 8080:8080 -p 8081:8081 -v antirion-data:/var/lib/antirion eliasbiondo/antirion:${GITHUB_REF_NAME#v}\`.

          Image: \`$IMAGE@$DIGEST\`

          Binaries: \`antirion-$GITHUB_REF_NAME-linux-<arch>.tar.gz\` for amd64 and arm64, with
          their SHA-256 in \`antirion-$GITHUB_REF_NAME-sha256sums.txt\`.

          Verify an archive:
          \`\`\`
          cosign verify-blob --bundle antirion-$GITHUB_REF_NAME-linux-amd64.tar.gz.sigstore.json \\
            --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com antirion-$GITHUB_REF_NAME-linux-amd64.tar.gz
          slsa-verifier verify-artifact antirion-$GITHUB_REF_NAME-linux-amd64.tar.gz \\
            --provenance-path antirion-$GITHUB_REF_NAME.intoto.jsonl \\
            --source-uri github.com/$GITHUB_REPOSITORY --source-tag $GITHUB_REF_NAME
          \`\`\`

          Verify the image:
          \`\`\`
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md \
            antirion-*.tar.gz antirion-*.cdx.json antirion-*-sha256sums.txt antirion-*.sigstore.json \
            antirion-*.intoto.jsonl
      # A release published with this workflow's token starts no other workflow, so the publish
      # workflow (Docker Hub) is started here.
      - name: Publish to Docker Hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$GITHUB_REF_NAME"
