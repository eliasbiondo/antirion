[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["bench", "fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
authors = ["Elias Biondo <contato@eliasbiondo.com>"]
license = "Apache-2.0"
repository = "https://github.com/eliasbiondo/antirion"
publish = false

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
arc-swap = { version = "1.9", default-features = false }
async-compression = { version = "0.4.50", default-features = false, features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "original-uri"] }
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
bpe-openai = { version = "0.3", default-features = false }
bytes = { version = "1.12", default-features = false, features = ["std"] }
cargo_metadata = { version = "0.23", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
crc32fast = { version = "1.5", default-features = false, features = ["std"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
cpu-time = { version = "1.0", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.4", default-features = false, features = ["std"] }
h2 = { version = "0.4", default-features = false }
hmac = { version = "0.13", default-features = false }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
http = { version = "1.5", default-features = false, features = ["std"] }
http-body = { version = "1.0", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.11", default-features = false, features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "server-auto", "server-graceful", "client-legacy", "http1", "http2", "service"] }
include_dir = { version = "0.7", default-features = false }
ipnet = { version = "2.12", default-features = false, features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always", "tzdb-zoneinfo"] }
maxminddb = { version = "0.32", default-features = false }
memory-stats = { version = "1.2", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
mimalloc = { version = "0.1.52", default-features = false }
parking_lot = { version = "0.12", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "cluster-async"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }
roxmltree = { version = "0.21", default-features = false, features = ["std", "positions"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15", default-features = false, features = ["std"] }
saphyr-parser = { version = "0.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tikv-jemallocator = { version = "0.7", default-features = false, features = ["background_threads"] }
tokio = { version = "~1.54", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["rt", "io"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json"] }
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
unicode-segmentation = { version = "1.12", default-features = false }
wasmtime = { version = "48.0.6", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "async"] }
wasmtime-wasi = { version = "48.0.6", default-features = false, features = ["p2"] }
wat = { version = "1", default-features = false, features = ["component-model"] }
uuid = { version = "1.26", default-features = false, features = ["std", "v7"] }
webauthn_rp = { version = "0.3", default-features = false, features = ["serde_relaxed", "serializable_server_state"] }
webpki-roots = { version = "1.0", default-features = false }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
region = { version = "4.0.1", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
clickhouse = { version = "0.15.3", default-features = false, features = ["rustls-tls-aws-lc", "rustls-tls-webpki-roots"] }

antirion-admin = { path = "crates/antirion-admin" }
antirion-cache = { path = "crates/antirion-cache" }
antirion-catalog = { path = "crates/antirion-catalog" }
antirion-config = { path = "crates/antirion-config" }
antirion-console = { path = "crates/antirion-console" }
antirion-core = { path = "crates/antirion-core" }
antirion-dialects = { path = "crates/antirion-dialects" }
antirion-egress = { path = "crates/antirion-egress" }
antirion-error = { path = "crates/antirion-error" }
antirion-ext = { path = "crates/antirion-ext" }
antirion-guardrails = { path = "crates/antirion-guardrails" }
antirion-identity = { path = "crates/antirion-identity" }
antirion-json = { path = "crates/antirion-json" }
antirion-limits = { path = "crates/antirion-limits" }
antirion-mail = { path = "crates/antirion-mail" }
antirion-mcp = { path = "crates/antirion-mcp" }
antirion-obs = { path = "crates/antirion-obs" }
antirion-pipeline = { path = "crates/antirion-pipeline" }
antirion-redis = { path = "crates/antirion-redis" }
antirion-providers = { path = "crates/antirion-providers" }
antirion-resilience = { path = "crates/antirion-resilience" }
antirion-router = { path = "crates/antirion-router" }
antirion-runtime = { path = "crates/antirion-runtime" }
antirion-server = { path = "crates/antirion-server" }
antirion-store = { path = "crates/antirion-store" }
antirion-testkit = { path = "crates/antirion-testkit" }
antirion-wire = { path = "crates/antirion-wire" }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
large_futures = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
overflow-checks = false

[profile.release.package.antirion-limits]
overflow-checks = true
