# The fuzz targets of the parsers that read untrusted input: request bodies of every dialect, the stream
# framings, upstream error bodies, URLs, credential and forwarding headers, tags and configuration
# documents. Run one with `cargo +nightly fuzz run <target>` (cargo-fuzz); `cargo fuzz list` names them.
# It is its own workspace, so libFuzzer never reaches the gateway's lock file.
[package]
name = "antirion-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
http = { version = "1.5", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
antirion-config = { path = "../crates/antirion-config" }
antirion-dialects = { path = "../crates/antirion-dialects" }
antirion-egress = { path = "../crates/antirion-egress" }
antirion-identity = { path = "../crates/antirion-identity" }
antirion-json = { path = "../crates/antirion-json" }
antirion-pipeline = { path = "../crates/antirion-pipeline" }
antirion-runtime = { path = "../crates/antirion-runtime" }
antirion-wire = { path = "../crates/antirion-wire" }

[lib]
path = "src/lib.rs"

[profile.release]
debug = 1

[[bin]]
name = "request_chat"
path = "fuzz_targets/request_chat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_responses"
path = "fuzz_targets/request_responses.rs"
test = false
doc = false
bench = false

[[bin]]
