{{- if not .Values.secrets.existingSecret }}
{{- $name := include "antirion.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "antirion.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  {{ .Values.secrets.bootstrapTokenKey }}: {{ index $existing.data .Values.secrets.bootstrapTokenKey }}
  {{ .Values.secrets.encryptionKeyKey }}: {{ index $existing.data .Values.secrets.encryptionKeyKey }}
  {{- else }}
  {{ .Values.secrets.bootstrapTokenKey }}: {{ randAlphaNum 48 | b64enc }}
  {{ .Values.secrets.encryptionKeyKey }}: {{ randAlphaNum 32 | b64enc | b64enc }}
  {{- end }}
{{- end }}
