apiVersion: v1
kind: Service
metadata:
  name: {{ include "antirion.fullname" . }}
  labels:
    {{- include "antirion.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "antirion.selector" . | nindent 4 }}
  ports:
    - name: data
      port: {{ .Values.service.dataPort }}
      targetPort: data
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
