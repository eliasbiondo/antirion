# The cells of the benchmark. Every cell runs on the reference topology unless `needs_topology`
# names another. A cell id with a dot (`C19.1MiB`) is a variant of the matrix cell before the dot.
# Pass conditions are `gates`: a summary metric (the median over repetitions), a comparison and a
# threshold; `minus` makes the metric a difference between two cells.
# Defaults: 30 s warm-up, 120 s measurement, 5 repetitions, mock L0, HTTP/1.1, one gateway node.

- {cell: C1, kind: open, scenario: S1, profile: P-min, level: {rps: 10000}, compare: true, gates: [
    {metric: overhead_us.p50, op: "<=", threshold: 150},
    {metric: overhead_us.p99, op: "<=", threshold: 500},
    {metric: overhead_us.p99_9, op: "<=", threshold: 1500},
    {metric: cpu_us_per_request, op: "<=", threshold: 120}]}
- {cell: C2, kind: open, scenario: S1, profile: P-std, level: {rps: 1000}, compare: true, gates: [
