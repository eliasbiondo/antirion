[package]
name = "antirion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
test-hooks = ["antirion-pipeline/test-hooks"]
# mimalloc as the allocator on Linux with glibc too, where jemalloc is the default.
mimalloc = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
antirion-config = { workspace = true }
antirion-core = { workspace = true }
antirion-ext = { workspace = true }
antirion-identity = { workspace = true }
antirion-limits = { workspace = true }
antirion-obs = { workspace = true }
antirion-pipeline = { workspace = true }
antirion-redis = { workspace = true }
antirion-runtime = { workspace = true }
antirion-server = { workspace = true }
antirion-store = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
mimalloc = { workspace = true }
rustix = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
webpki-roots = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
antirion-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-postgres = { workspace = true }

[lints]
workspace = true
