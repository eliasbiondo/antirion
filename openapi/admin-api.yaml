        picker:
          type: object
          description: A `pool` node's external endpoint picker on the answering replica, with its address, how its last ask
            ended and what it last chose. Absent for a pool the built-in scheduler picks for.
          properties:
            url:
              type: string
              description: '`picker_service.url`.'
            timeout:
              $ref: '#/components/schemas/Duration'
            on_error:
              enum:
                - reject
                - builtin
              description: '`picker_on_error`.'
            state:
              enum:
                - ok
                - failing
                - unknown
              description: '`ok` when the last ask was answered (an empty choice included), `failing` when it failed (unreachable,
                timed out or malformed), `unknown` before the replica asked it.'
            asks:
              type: integer
              minimum: 0
              description: Asks since the replica started or the routing state was reset.
            failures:
              type: integer
              minimum: 0
            last_asked_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_pick:
              type:
                - object
                - 'null'
              description: The picker's last answer.
              properties:
                at:
                  $ref: '#/components/schemas/Timestamp'
                deployments:
                  type: array
                  items:
                    type: string
                  description: The pool's deployments its destination named, in its order; empty for "no endpoint".
                served:
                  type:
                    - string
                    - 'null'
                  description: The deployment that produced the terminal response after that pick; null while none has.
              required:
                - at
                - deployments
                - served
            last_failure:
              type:
                - object
                - 'null'
              properties:
                at:
                  $ref: '#/components/schemas/Timestamp'
                reason:
                  type: string
                  description: Why the ask failed, in words.
              required:
                - at
                - reason
          required:
            - url
            - timeout
            - on_error
            - state
            - asks
            - failures
            - last_asked_at
            - last_pick
            - last_failure
      required:
        - path
        - type
        - children
        - replica
