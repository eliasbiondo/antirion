              description: '`service` when its owner is a service account; else `ephemeral` when created by the playground
                or with a lifetime of at most 7 days; else `service` when it has no owner; else `user`.'
            status:
              enum:
                - active
                - disabled
                - rotating
                - expiring
                - expired
              description: The first that holds of disabled, expired, rotating (a grace is running), expiring (within 7 days),
                else active.
