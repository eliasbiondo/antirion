      description: Filters, facets and counts; each item's read-only facts
      tags:
        - Tenancy
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: last_active_before
          in: query
          required: false
          description: Users last active before this time, or never.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: state
          in: query
          required: false
          description: Users in one of these states (`metadata.state`).
          schema:
            type: array
            items:
              enum:
                - active
                - invited
                - disabled
          explode: true
        - name: role
          in: query
          required: false
          description: Users holding a binding of one of these roles.
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: team
          in: query
          required: false
          description: Users whose primary team is, or who hold a binding on, one of these teams or one of its projects.
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: q
          in: query
          required: false
          description: Case-insensitive substring of the name, display name or email.
          schema:
            type: string
      responses:
        '200':
          description: Users, ordered by name.
          headers:
            x-antirion-version:
              $ref: '#/components/headers/XAntirionVersion'
          content:
            application/json:
              schema:
