components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: ak-antirion admin token
      description: Service-account or user admin token, or the bootstrap credential.
    operatorSession:
      type: apiKey
      in: cookie
      name: antirion_session
      description: Operator session. The cookie is `HttpOnly; Secure; SameSite=Lax`, so cookie-authenticated `POST`/`PUT`/`PATCH`/`DELETE`
        must also send an `Origin` equal to `auth.admin.public_origin` (403 otherwise).
  schemas:
    A2aAgentCreate:
      type: object
      description: '`metadata` is ignored if sent.'
      properties:
        name:
          type: string
        spec:
          $ref: ../schema/antirion-config.schema.json#/$defs/A2a/properties/agents/additionalProperties
      required:
        - name
        - spec
    A2aAgentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/A2aAgentResource'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      required:
        - items
        - next_cursor
    A2aAgentReplace:
      type: object
      description: Full replacement of `spec`; `metadata` is ignored if sent.
      properties:
        name:
          type: string
          description: Optional; must equal the path name when sent.
        spec:
          $ref: ../schema/antirion-config.schema.json#/$defs/A2a/properties/agents/additionalProperties
      required:
        - spec
    A2aAgentResource:
      type: object
      properties:
        name:
          type: string
        spec:
          $ref: ../schema/antirion-config.schema.json#/$defs/A2a/properties/agents/additionalProperties
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
      required:
        - name
        - spec
        - metadata
    A2aSettings:
      type: object
      description: '`a2a` singleton (owner). `a2a` without `agents` (served as `/a2a/agents`).'
      properties:
        spec:
          allOf:
            - $ref: ../schema/antirion-config.schema.json#/$defs/A2a
          properties:
            agents: false
          description: Without `agents` (served as nested collections).
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
      required:
        - spec
        - metadata
    A2aSettingsReplace:
      type: object
      properties:
        spec:
          allOf:
            - $ref: ../schema/antirion-config.schema.json#/$defs/A2a
          properties:
            agents: false
          description: Without `agents` (served as nested collections).
      required:
        - spec
    AccessRequest:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        scope:
          type: string
        reason:
          type: string
        requested_by:
          type: string
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        state:
          enum:
            - open
            - approved
            - denied
        decided_by:
          type:
            - string
            - 'null'
        decided_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      required:
        - id
        - model
        - scope
        - requested_by
        - requested_at
        - state
    AccessRequestCreate:
      type: object
      properties:
        scope:
          type: string
          pattern: ^(organization|team|project|key)/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
        reason:
          type: string
          maxLength: 500
      required:
        - scope
    AccessRequestList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequest'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      required:
        - items
        - next_cursor
    AdminError:
      type: object
      description: Admin error envelope. The data plane uses instead.
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationDetail'
              description: Every problem found (validation_failed), or the referrers (resource_in_use).
          required:
            - code
            - message
            - request_id
      required:
        - error
    AdminSettings:
      type: object
      description: '`admin` singleton (owner). Static.'
      properties:
        spec:
          $ref: ../schema/antirion-config.schema.json#/$defs/Admin
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
      required:
        - spec
        - metadata
    AdminToken:
      type: object
      properties:
        kid:
          type: string
        hint:
          type: string
        description:
          type:
            - string
            - 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      required:
        - kid
        - hint
        - created_at
    AdminTokenCreate:
      type: object
      properties:
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        description:
          type: string
          maxLength: 500
    AdminTokenCreated:
      allOf:
        - $ref: '#/components/schemas/AdminToken'
        - type: object
          properties:
            token:
              type: string
              description: Plaintext `ak-antirion-` token, returned once.
          required:
            - token
    AdminTokenList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminToken'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      required:
        - items
        - next_cursor
    Alert:
      type: object
      description: Alert instance.
      properties:
        id:
          type: string
        rule:
          type: string
        fingerprint:
          type: string
        category:
          type: string
        severity:
          enum:
            - critical
            - warning
            - info
        status:
          enum:
            - firing
            - acknowledged
            - resolved
        snoozed_until:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        fired_at:
          $ref: '#/components/schemas/Timestamp'
        acknowledged_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        acknowledged_by:
          type:
            - string
            - 'null'
        resolved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        resolved_by:
          type:
            - string
            - 'null'
        summary:
          type: string
        scope:
          type: object
          additionalProperties:
            type: string
        value:
          type:
            - number
            - 'null'
        threshold:
          type:
            - number
            - 'null'
        owner_team:
          type:
            - string
            - 'null'
        runbook_url:
          type:
            - string
            - 'null'
        impact:
          type: object
          properties:
            requests:
              type: integer
              minimum: 0
            errors:
              type: integer
              minimum: 0
            throttled:
              type: integer
              minimum: 0
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/AlertTimelineEntry'
      required:
        - id
        - rule
        - fingerprint
        - category
        - severity
        - status
        - fired_at
        - summary
    AlertChannelCreate:
      type: object
      description: '`metadata` is ignored if sent.'
      properties:
        name:
          type: string
        spec:
          $ref: ../schema/antirion-config.schema.json#/$defs/Observability/properties/alerts/properties/channels/additionalProperties
      required:
        - name
        - spec
    AlertChannelList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertChannelResource'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      required:
        - items
        - next_cursor
    AlertChannelReplace:
      type: object
      description: Full replacement of `spec`; `metadata` is ignored if sent.
      properties:
        name:
          type: string
          description: Optional; must equal the path name when sent.
        spec:
          $ref: ../schema/antirion-config.schema.json#/$defs/Observability/properties/alerts/properties/channels/additionalProperties
      required:
        - spec
    AlertChannelResource:
      type: object
      properties:
        name:
          type: string
        spec:
          $ref: ../schema/antirion-config.schema.json#/$defs/Observability/properties/alerts/properties/channels/additionalProperties
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
      required:
        - name
        - spec
        - metadata
    AlertDelivery:
      type: object
      properties:
        event_id:
          type: string
        webhook:
          type: string
          description: The webhook, or the alert channel, the attempt went to.
        target_kind:
          enum:
            - webhook
            - channel
        event_type:
          type: string
        attempt:
          type: integer
          minimum: 1
