          type:
            - string
            - 'null'
          description: The user the declaration's `owner` names; `owner` is the owning resource.
        state:
          enum:
            - on_pace
            - at_risk
            - over
            - blocked
        forecast:
          $ref: '#/components/schemas/BudgetForecast'
          description: 'Absent for a rolling budget (`algorithm: sliding_window`), whose window has no end to project to.'
        grants:
          type: array
          description: The running overage grants.
          items:
            $ref: '#/components/schemas/BudgetGrant'
        refused_requests:
          type: integer
          minimum: 0
          description: Requests this budget refused in the current period, every node's.
        downgraded_requests:
          type: integer
          minimum: 0
          description: Requests this budget downgraded in the current period, every node's.
        children_allocated:
          type:
            - string
            - 'null'
          description: The sum of the amounts of the budgets directly below this one, null when none.
        downgrade:
          oneOf:
            - type: object
              properties:
                at:
                  type: number
                to_model:
                  type: string
                to_tier:
                  type: string
              required:
                - at
            - type: 'null'
          description: The declaration's downgrade.
      required:
        - level
        - owner
        - name
        - partition
        - unit
        - mode
        - amount
        - spent
        - reserved
        - remaining
        - period_start
        - resets_at
