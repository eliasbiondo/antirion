          type: integer
          description: 0-based, in start order
        reason:
          type: string
          description: '`primary`, `retry`, `fallback`, `hedge`'
        provider:
          type: string
          description: Target of this attempt
        deployment:
          type: string
          description: Target of this attempt
        upstream_model:
          type: string
          description: Target of this attempt
        credential:
          type:
            - string
            - 'null'
          description: Name of the provider credential entry used (05 multi-key); never the secret
        started_at:
          type: string
          description: '`a.start`'
          format: date-time
        duration_ms:
          type: number
          description: '`a.end − a.start`'
        ttft_ms:
          type:
            - number
            - 'null'
          description: 'Streaming: `a.start` → first content chunk'
        status_code:
          type:
            - integer
            - 'null'
          description: Upstream status; null if no response head was received
        outcome:
          type: string
          description: '`outcome`'
        failure_class:
          type:
            - string
            - 'null'
          description: classifier value; null on success
        retry_after_ms:
          type:
            - integer
            - 'null'
          description: Upstream `Retry-After` (or provider reset header) converted to ms
        upstream_request_id:
          type:
            - string
            - 'null'
          description: Provider request id header of this attempt
        error_message:
          type:
            - string
            - 'null'
          description: Scrubbed upstream or transport error message, ≤ 2048 bytes
        error_body:
          type:
            - string
            - 'null'
          description: Only with `log_upstream_error_bodies`; ≤ `upstream_error_body_max`; scrubbed
        usage:
          anyOf:
            - $ref: '#/components/schemas/LogUsage'
            - type: 'null'
          description: Same shape as top-level `usage` without `source`, for this attempt, when it reported usage
        key_rotated:
          type: boolean
          description: This attempt's failure caused a credential rotation
