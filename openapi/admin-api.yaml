          type: string
          description: The amount admission refuses at, `amount` plus the running grants.
        spent:
          type: string
        reserved:
          type: string
        remaining:
          type: string
          description: max(0, effective_amount − spent − reserved).
        period_start:
          $ref: '#/components/schemas/Timestamp'
