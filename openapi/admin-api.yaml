            last_rotated_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            rotation_due:
              type: boolean
            rotation_due_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
              description: When the key is due for rotation under its policy's `rotation_max_age`.
