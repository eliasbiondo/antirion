            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_error:
          type:
            - string
            - 'null'
        cached_tools:
          type: integer
          minimum: 0
        processes:
          description: A `stdio` server's process pool on the serving node; null for other transports.
          oneOf:
            - type: object
              properties:
                size:
                  type: integer
                  minimum: 1
                running:
                  type: integer
                  minimum: 0
                started:
                  type: integer
                  minimum: 0
                  description: Processes started since the pool was created, restarts included.
              required:
                - size
                - running
                - started
            - type: 'null'
        tools:
          description: The tools the gateway saw in the server's last list on the serving node, by name, with their SHA-256
            (JCS) fingerprint and approval state; empty until a list was read.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              fingerprint:
                type: string
                pattern: ^[0-9a-f]{64}$
              approved:
                type:
                  - boolean
                  - 'null'
                description: Whether the fingerprint is the one last approved; null while no approval was ever recorded for
                  the server.
              hidden:
                type: boolean
                description: Hidden from lists and calls now (`pin_tool_definitions` on and not approved).
            required:
              - name
              - fingerprint
              - approved
              - hidden
        approved_at:
          description: When the server's tools were last approved (`:approve_tools`); null if never.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_contact_at:
          description: When the serving node last tried to initialize the server or read its tools; null if it never did.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_contact_error:
          description: Why that attempt failed, in words; null when it succeeded or there was none. Unlike `last_error` (the
            modern era's `server/discover`), it tells whether the server can be reached.
          type:
            - string
            - 'null'
      required:
        - era_capability
        - last_discovery_at
        - last_error
        - cached_tools
        - tools
        - approved_at
        - last_contact_at
        - last_contact_error
    McpToolApproval:
