                    remaining:
                      type:
                        - integer
                        - 'null'
                    reset_at:
                      oneOf:
                        - $ref: '#/components/schemas/Timestamp'
                        - type: 'null'
                observed_at:
                  $ref: '#/components/schemas/Timestamp'
                stale:
                  type: boolean
            - type: 'null'
