      summary: SAML assertion consumer service
      description: The identity provider's HTTP-POST response. A valid signed assertion for a request this gateway started
        (or an unsolicited one, with `allow_idp_initiated`) starts a session and redirects to `return_to` (or the relay state);
        the answer to a test sign-in reports the mapping instead.
