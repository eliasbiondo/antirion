        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
      x-antirion-permission: alerts:write
  /alerts/channels/{channel}:
