        - spool
        - config
        - clock_skew_ms
      additionalProperties: false
    EncryptionReport:
      type: object
      description: Encryption in transit and at rest on the serving node.
      properties:
        inbound_tls:
          type: object
          properties:
            data:
              $ref: '#/components/schemas/ListenerTlsReport'
            admin:
              $ref: '#/components/schemas/ListenerTlsReport'
            reload_interval:
              $ref: '#/components/schemas/Duration'
          required:
            - data
            - admin
            - reload_interval
        at_rest:
          type: object
          properties:
            algorithm:
              const: AES-256-GCM
            keys:
              type: array
              description: The first key encrypts; every key decrypts.
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The first 16 hex digits of the SHA-256 of the key, never the key.
                  primary:
                    type: boolean
                  source:
                    enum:
                      - configured
                      - data_dir
                    description: '`security.secrets.encryption_keys` of the startup file, or the key generated into the data
                      directory.'
                required:
                  - id
                  - primary
                  - source
            external_stores:
              type: array
              description: The configured external secret stores and what reading them last did on the serving node; never
                a value.
              items:
                type: object
                properties:
                  name:
                    enum:
                      - vault
                      - aws_sm
                      - gcp_sm
                      - azure_kv
                  references:
                    type: integer
                    minimum: 0
                    description: Distinct references of the serving configuration that name the store.
                  state:
                    enum:
                      - ok
                      - failing
                      - unused
                    description: '`failing` while a reference''s last read failed (its last value stays in use); `unused`
                      without references.'
                  last_refresh_at:
                    oneOf:
                      - $ref: '#/components/schemas/Timestamp'
                      - type: 'null'
                    description: The last successful read on the serving node.
                  last_error:
                    type:
                      - string
                      - 'null'
                    description: Why the last read failed while the store is failing; never a value.
                required:
                  - name
                  - references
                  - state
                  - last_refresh_at
                  - last_error
          required:
            - algorithm
            - keys
            - external_stores
      required:
        - inbound_tls
        - at_rest
    InvitationCheck:
      type: object
      description: What an invitation token is, without using it.
      properties:
        state:
          enum:
            - valid
            - expired
            - used
            - unknown
          description: '`unknown` also for a token a resend replaced or whose invitation was cancelled.'
        email:
          type:
            - string
            - 'null'
          description: The invited address; null unless `valid`.
        organization:
          oneOf:
            - type: object
              properties:
                name:
                  type: string
                display_name:
                  type: string
              required:
                - name
                - display_name
            - type: 'null'
          description: The organization of the invitation's first binding scoped to one; null unless `valid` or when no binding
            is.
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      required:
        - state
        - email
        - organization
        - expires_at
    ListenerTlsReport:
      type: object
