    ProviderPressure:
      type: object
      description: Upstream rate-limit pressure per provider. A utilization is the summed peak use (`limit − remaining`) of
        the provider's credentials over their summed limits in the bucket; null when no reading with both a limit and a remaining
        count fell in it.
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
        interval:
          type:
            - string
            - 'null'
          description: The interval asked for; null gives one bucket from `from` to `to`.
        threshold:
          type: number
          description: The share of a quota at which a provider counts as hot (0.8).
        items:
          type: array
          description: One entry per provider with a reading in the range, by name.
          items:
            type: object
            properties:
              provider:
                type: string
              buckets:
                type: array
                items:
                  type: object
                  properties:
                    start:
                      $ref: '#/components/schemas/Timestamp'
                    rpm_utilization:
                      type:
                        - number
                        - 'null'
                      minimum: 0
                    tpm_utilization:
                      type:
                        - number
                        - 'null'
                      minimum: 0
                    requests_limit:
                      type:
                        - integer
                        - 'null'
                      minimum: 0
                    tokens_limit:
                      type:
                        - integer
                        - 'null'
                      minimum: 0
                  required:
                    - start
                    - rpm_utilization
                    - tpm_utilization
                    - requests_limit
                    - tokens_limit
            required:
              - provider
              - buckets
        hot:
          type: array
          description: Per bucket, the providers whose request or token utilization reached `threshold`.
          items:
            type: object
            properties:
              start:
                $ref: '#/components/schemas/Timestamp'
              providers:
                type: integer
                minimum: 0
            required:
              - start
              - providers
      required:
        - from
        - to
        - interval
        - threshold
        - items
        - hot
    SamlProviderStatus:
      type: object
      description: A SAML provider's status; never a key.
      properties:
        name:
          type: string
        display_name:
          type: string
        sp_entity_id:
          type: string
        acs_url:
          type: string
        sp_metadata_url:
          type: string
        login_url:
          type: string
        name_id_format:
          type: string
          description: The NameID format URN the requests ask for.
        allow_idp_initiated:
          type: boolean
        idp:
          type: object
          properties:
            source:
              enum:
                - metadata_url
                - metadata
                - fields
            metadata_url:
              type:
                - string
                - 'null'
            metadata_refresh:
              oneOf:
                - $ref: '#/components/schemas/Duration'
                - type: 'null'
            entity_id:
              type:
                - string
                - 'null'
              description: Null until metadata was fetched.
            sso_url:
              type:
                - string
                - 'null'
            certificates:
              type: array
              items:
                type: object
                properties:
                  subject:
                    type:
                      - string
                      - 'null'
                    description: The subject's common name.
                  not_after:
                    oneOf:
                      - $ref: '#/components/schemas/Timestamp'
                      - type: 'null'
                  sha256:
                    type: string
                    description: Lowercase hex SHA-256 of the DER certificate.
                required:
                  - subject
                  - not_after
                  - sha256
            last_sync_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
              description: When the stored metadata was fetched.
            last_attempt_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_error:
              type:
                - string
                - 'null'
              description: Why the last fetch failed, while the stored copy stays in use.
          required:
            - source
            - metadata_url
            - metadata_refresh
            - entity_id
            - sso_url
            - certificates
            - last_sync_at
            - last_attempt_at
            - last_error
      required:
        - name
        - display_name
        - sp_entity_id
        - acs_url
        - sp_metadata_url
        - login_url
        - name_id_format
        - allow_idp_initiated
        - idp
