        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
      required:
        - valid
        - errors
        - warnings
