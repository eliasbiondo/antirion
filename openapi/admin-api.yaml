  /alerts:
    get:
      operationId: listAlerts
      summary: List alert instances
      tags:
        - Alerts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: status
          in: query
          required: false
          description: Instance status.
          schema:
            type: array
            items:
              enum:
                - firing
                - acknowledged
                - resolved
          explode: true
        - name: severity
          in: query
          required: false
          description: Severity.
          schema:
            type: array
            items:
              enum:
                - critical
                - warning
                - info
          explode: true
        - name: category
          in: query
          required: false
          description: Category.
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: rule
          in: query
          required: false
          description: Rule name.
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: q
          in: query
          required: false
          description: Search.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: Instances whose scope has every given `<dimension>:<value>` (for example `model:gpt-5`), repeatable.
          schema:
            type: array
            items:
              type: string
              pattern: ^[a-z_]+:.+$
          explode: true
      responses:
        '200':
          description: OK.
          headers:
            x-antirion-version:
              $ref: '#/components/headers/XAntirionVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      x-antirion-permission: alerts:read
