            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                  description: The base64 of the `samlp:Response`.
                RelayState:
                  type: string
                  description: Used as `return_to` by an unsolicited response; ignored otherwise.
              required:
                - SAMLResponse
      responses:
        '200':
          description: The answer to a test sign-in; no session starts and nobody is provisioned.
          headers:
