          oneOf:
            - type: object
              properties:
                requests:
                  type: object
                  properties:
                    limit:
                      type:
                        - integer
                        - 'null'
                    remaining:
                      type:
                        - integer
                        - 'null'
                    reset_at:
                      oneOf:
                        - $ref: '#/components/schemas/Timestamp'
                        - type: 'null'
                tokens:
