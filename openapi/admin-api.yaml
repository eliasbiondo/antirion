# Antirion Admin API — OpenAPI 3.1 contract.
# Resource `spec` bodies reference schema/antirion-config.schema.json `$defs`.
openapi: 3.1.0
info:
  title: Antirion Admin API
  version: v1
  summary: Configuration, runtime state, reports and operations of an Antirion gateway.
  description: |
    The Admin API of Antirion, served only on the admin listener under `/admin/v1` and published by
    the gateway at `GET /admin/v1/openapi.json`. Within `v1`, changes are additive only.

    **Representation.** Collection resources are `{name, spec, metadata}`; singleton settings are `{spec, metadata}`.
    `spec` is exactly the config fragment of that entry (schema: `schema/antirion-config.schema.json`);
    `metadata` is read-only and ignored on write. Secrets are never returned: a field set by reference shows the
    reference, a literal shows `"[REDACTED]"`, and writing `"[REDACTED]"` keeps the stored value.

    **Verbs.** `GET` list/read; `POST` to a collection creates (201, `Location`; 409 `already_exists`); `PUT` creates
    (201) or replaces (200); `PATCH` (`application/merge-patch+json`, RFC 7396 on the representation, body
    `{"spec": {…}}`); `DELETE` (204). Custom actions are `POST /<collection>/<name>:<action>` or
    `POST /<singleton>:<action>`. Every mutation accepts `?wait=<duration>` and answers with
    `x-antirion-config-generation` and `x-antirion-config-propagated`. Unknown query parameters are
    400 `invalid_parameter`.

    **Lists** return `{items, next_cursor}`, take `limit` and `cursor`, are ordered by name (collections) or newest
    first (time series).

    **Concurrency.** Resource reads return a strong `ETag`; `PUT`/`PATCH`/`DELETE` honour `If-Match`; `PUT` honours
    `If-None-Match: *`; apply takes `If-Match: "<generation>"` (412 `precondition_failed` on mismatch).
    `POST` honours `Idempotency-Key`.

    **Authentication.** `Authorization: Bearer <admin token>` (service-account tokens `ak-antirion-…` and the
    bootstrap credential) or the `antirion_session` cookie from `POST /auth/session` or OIDC login. Cookie-authenticated `POST`/`PUT`/`PATCH`/`DELETE` must send an `Origin` equal to
    `auth.admin.public_origin` (403 otherwise). Virtual keys are always 401. Public operations: OIDC login and
    callback, and `POST /auth/session`.

    **Errors** use the admin envelope `{"error": {code, message, request_id, details[]}}`:

    | Status | `error.code` | When |
    |---|---|---|
    | 400 | `malformed_document` | Body is not parseable YAML/JSON, duplicate keys, custom tags |
    | 400 | `validation_failed` | Well-formed but invalid; `details[]` lists every problem |
    | 400 | `invalid_parameter` | Unknown or invalid query parameter, invalid cursor |
    | 401 | `unauthenticated` | Missing/invalid admin credential; any virtual key |
    | 403 | `forbidden` | Authenticated operator lacks the permission |
    | 404 | `not_found` | Unknown resource, collection or path; resource outside the operator's scope |
    | 405 | `method_not_allowed` | E.g. writing a static setting; `Allow` header set |
    | 409 | `already_exists` | POST create of an existing name |
    | 409 | `resource_in_use` | DELETE of a resource that others reference; `details[]` lists referrers |
    | 409 | `managed_by_apply` | Write to an apply-managed resource while `admin.config.lock_applied` is true |
    | 412 | `precondition_failed` | `If-Match` / `If-None-Match` mismatch |
    | 413 | `payload_too_large` | Body above `admin.api.max_document` |
    | 415 | `unsupported_media_type` | Content type not JSON/YAML/merge-patch |
    | 422 | `idempotency_key_reused` | Same `Idempotency-Key`, different body |
    | 429 | `rate_limited` | Admin rate limit, `Retry-After` set |
    | 500 | `internal` | Bug |
    | 503 | `store_unavailable` | The store cannot be written, `Retry-After` set |

    **Extensions.** `x-antirion-permission` names the permission an operation needs, in the scope of
    the resource it touches; `authenticated` means any authenticated principal, `public` no credential, and
    `role:gateway_admin` the role itself.
  license:
    name: See repository
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: '{scheme}://{admin_listener}/admin/v1'
    variables:
      scheme:
        default: http
        enum:
          - http
          - https
      admin_listener:
        default: 127.0.0.1:8081
        description: The admin listener (`server`).
security:
  - adminToken: []
  - operatorSession: []
tags:
  - name: Config document
    description: Export, validate, diff, apply and roll back the config document.
  - name: Settings
    description: Singleton settings of the config document (`/settings/<key>`).
  - name: Providers and deployments
    description: Providers, deployments, provider types and capabilities.
  - name: Models and routes
    description: Models, routes and routing state.
  - name: Tenancy
    description: Organizations, teams, projects and users.
  - name: Keys
    description: Virtual keys.
  - name: Access control
    description: Role bindings, roles and admin tokens.
  - name: Sessions
    description: Operator sessions and SSO.
  - name: Guardrails
    description: Guardrail definitions and the test action.
  - name: Extensions
    description: Extensions and their runtime counters.
  - name: MCP and A2A
    description: MCP servers and gateways, A2A agents.
  - name: Health
    description: Deployment health and provider status.
  - name: Limits, budgets and spend
    description: Limit and budget state, prices, ledger and spend reports.
  - name: Cache
    description: Cache invalidation and status.
  - name: Observability
    description: Request logs, analytics and alert deliveries.
  - name: Alerts
    description: Alert instances, rules and channels, webhook tests and delivery status.
  - name: Audit
    description: The append-only audit log.
  - name: Governance
    description: Change requests, the playground, ingress pause and jobs.
  - name: Cluster
    description: Detailed health, nodes, convergence and drain.
  - name: Discovery
    description: Status and this document.
  - name: Test mode
    description: Deterministic test controls, only with `--test-mode`.
paths:
  /a2a/agents:
    get:
      operationId: listA2aAgents
      summary: List A2A agents
      tags:
        - MCP and A2A
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A2A agents, ordered by name.
          headers:
            x-antirion-version:
              $ref: '#/components/headers/XAntirionVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2aAgentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      x-antirion-permission: mcp:read
    post:
      operationId: createA2aAgent
      summary: Create a A2A agent
      tags:
        - MCP and A2A
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2aAgentCreate'
      responses:
        '201':
          description: A2A agent created.
          headers:
            x-antirion-version:
              $ref: '#/components/headers/XAntirionVersion'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            x-antirion-config-generation:
              $ref: '#/components/headers/XConfigGeneration'
            x-antirion-config-propagated:
              $ref: '#/components/headers/XConfigPropagated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2aAgentResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
