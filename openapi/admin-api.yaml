          enum:
            - none
            - optional
            - required
        certificate:
          description: The leaf certificate in `cert_file` as last read; null without TLS or when it cannot be read.
          oneOf:
            - $ref: '#/components/schemas/CertificateReport'
            - type: 'null'
      required:
        - enabled
        - versions
        - client_auth
        - certificate
    CertificateReport:
