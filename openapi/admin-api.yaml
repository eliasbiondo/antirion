      type: object
      properties:
        path:
          type: string
          description: 'Config-document path: dotted keys, `[n]` for list indexes, `["…"]` for keys containing `.` or `[`
            (e.g. `routes.fast.targets[2].weight`).'
        code:
          type: string
          description: '`unknown_field`, `type_mismatch`, `required`, `out_of_range`, `invalid_format`, `invalid_enum`, `unresolved_reference`,
            `duplicate_key`, `conflict`, `secret_unresolved`, `secret_required`, `invalid_expression`, `unsupported_version`,
            `static_setting`, `locked_by_broader_level`, `malformed_document`, or an area-specific code registered by its
            owning spec (open set).'
        message:
          type: string
      required:
        - path
        - code
        - message
    Warning:
      type: object
      properties:
        path:
          type: string
        code:
          type: string
          examples:
            - deprecated_version
        message:
          type: string
      required:
        - code
        - message
